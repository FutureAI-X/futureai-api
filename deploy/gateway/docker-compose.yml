# 边缘网关 —— 全机器唯一占用 80/443 的容器
#
# 部署位置: /opt/stacks/gateway/
#
# 前置（一次性，见 deploy/README.md）:
#   docker network create --subnet 172.20.0.0/16 gateway-proxy
#
# 它按域名把请求分流到各服务，同时负责 TLS 终止、HSTS、gzip，
# 以及登录接口的限流。各服务本身不发布任何宿主机端口。

services:
  gateway:
    # 钉在 stable 分支，不用 latest：latest 会在某次 pull 时静默跳大版本，
    # 而 nginx 的行为在大版本之间确实会变。stable 分支仍能拿到安全补丁。
    image: nginx:1.30-alpine
    container_name: gateway
    restart: unless-stopped
    env_file: .env
    environment:
      # 把 envsubst 的代换范围严格限制在这个域名变量上。
      #
      # 官方镜像的入口脚本会对 /etc/nginx/templates/*.template 做 envsubst，
      # 默认替换「环境里存在的一切同名变量」。模板里写着大量 nginx 自身的
      # 变量（$uri、$host、$request_uri …），一旦某个环境变量恰好同名，
      # 就会被静默替换成别的东西，症状是配置看起来正常但行为诡异。
      # 加上这道过滤后，代换只可能发生在我们自己声明的变量上。
      #
      # ⚠️ 以后在 .env 里加了新域名，记得同步加到这里，否则模板里
      #    对应的 ${NEW_DOMAIN} 不会被替换。
      NGINX_ENVSUBST_FILTER: "^TOKEN_HUB_DOMAIN$"
    volumes:
      # 模板目录。入口脚本会把它渲染到 /etc/nginx/conf.d/ 下。
      - ./templates:/etc/nginx/templates:ro
      # 被 include 的片段。放在 templates 之外，因此不经 envsubst，
      # 也就没有变量被误替换的风险。
      - ./snippets:/etc/nginx/snippets:ro
      # 证书。域名未解析时先用 self-signed.sh 生成，之后再换成正式证书。
      - ./certs:/etc/nginx/certs:ro
      # ACME HTTP-01 校验目录，certbot --webroot 会往这里写
      - ./certbot/www:/var/www/certbot:ro
      # 访问日志落盘，便于按域名排查
      - ./logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      proxy:
        # 固定 IP。各服务的 TRUSTED_PROXIES 要填这个地址，
        # 用来从 X-Forwarded-For 还原真实客户端 IP。
        # 地址一变，三个服务都会把全部用户看成同一个来源，登录限流会失效。
        ipv4_address: 172.20.0.2

networks:
  # 预先用 docker network create 建好，四个 compose 项目共用。
  # 由 compose 管理的话，任何一个项目 down 都可能把网络一起删掉，
  # 导致其余服务失去网络。
  proxy:
    external: true
    name: gateway-proxy
