# 反向代理公共配置，被每个 HTTPS server 块 include。
#
# 本文件不在 templates/ 下，不经过 envsubst。
#
# ---------------------------------------------------------------------------
# ⚠️ 必须与各服务 .env 中的 TRUSTED_PROXIES 配合
# ---------------------------------------------------------------------------
#
# X-Forwarded-For 使用 $proxy_add_x_forwarded_for：它把真实客户端 IP
# 【追加】到链尾。即使客户端预先伪造了 XFF，Gin 也会从右往左扫描，
# 取第一个不在信任列表中的 IP —— 也就是网关追加的真实 IP，伪造值被忽略。
#
# 但这个机制成立的前提是：应用知道「网关是可信的」。
# 网关容器在这个网络上的固定地址是 172.20.0.2，因此各服务要设置:
#
#     TRUSTED_PROXIES=172.20.0.2/32
#
# 漏配的后果：应用把所有请求的来源都看成网关 IP，登录限流会把全体用户
# 当成同一来源 —— 任意几次失败就能锁死所有人。
#
# 反向的坑同样要避免：绝不能填 0.0.0.0/0，那等于信任一切，
# XFF 重新变得可伪造，限流再次失效。

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 10s;

# 请求体不在网关层做流式转发，而是先完整缓冲再发给后端。
# 这正好能挡住 slow-loris 式的慢速上传，因此保持默认（缓冲开启），
# 不要设置 proxy_request_buffering off。
#
# 单文件上限见 tls.conf 里的 client_max_body_size。


# ---------------------------------------------------------------------------
# gzip
# ---------------------------------------------------------------------------
#
# 只压缩文本。图片、字体等已压缩过的格式再压一遍纯属浪费 CPU。
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;
