# TLS 与连接层参数，被每个 HTTPS server 块 include。
#
# 本文件不在 templates/ 下，因此不经过 envsubst —— 内容里出现 $ 也不会被误替换。

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
# 关闭会话票据：票据用静态密钥加密，泄露后可解密历史会话，
# 与会话缓存相比没有额外收益。
ssl_session_tickets off;

# 三个域名共用同一张 SAN 证书（见 scripts/certbot.sh），
# 因此所有 server 块指向同一对文件。
ssl_certificate     /etc/nginx/certs/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/privkey.pem;


# HSTS
#
# ⚠️ 出厂值刻意用 300 秒（5 分钟）而不是 1 年。
#    浏览器会记住这个头，一旦 HTTPS 配错，在 max-age 到期前用户根本
#    无法绕过——连"点高级、继续访问"都做不到。首次上线先短窗口观察。
#
# 稳定运行一两天、确认 HTTPS 完全正常之后，再改成：
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
# includeSubDomains 会覆盖这台主机的所有子域。当前只服务一个域名没问题，
# 但若将来在同一个主域下放纯 HTTP 的服务，会被浏览器强制跳转 HTTPS。
add_header Strict-Transport-Security "max-age=300" always;


# 基础硬化
server_tokens off;              # 不在错误页里泄露 nginx 版本号

# /v1/uploads/images 单文件上限 10MB，加上 multipart 边界与头字段的余量。
# nginx 默认只有 1MB，不放开上传会在到达应用之前就被 413 拒绝。
client_max_body_size 12m;

client_body_timeout 60s;
client_header_timeout 60s;
